{% extends 'catalogo/base.html' %}

{% block titulo %}Iniciar sesión — CamiDevs{% endblock %}

{% block contenido %}
     {% if next %}
        <p>Inicia sesión para ver esa página.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Entrar</button>
    </form>
    <p><a href="{% url 'password_reset' %}">¿Has olvidado tu contraseña?</a></p>
     <p>¿No tienes cuenta? <a href="{% url 'cuentas:registro' %}">Regístrate</a></p>
{% endblock %}
