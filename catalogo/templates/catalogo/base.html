<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}CamiDevs{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'catalogo:inicio' %}">CamiDevs</a>
        <a href="{% url 'catalogo:contacto' %}">Contacto</a>
    </nav>
    {% if messages %}
        <ul class="mensajes">
    {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
        </ul>
    {% endif %}
    <main>
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
